type User {
  id: ID!
  name: String!
  email: String!
  posts: [Post!]!
  comments: [Comment!]!
}

type Post {
  id: ID!
  title: String!
  content: String!
  authorId: User!
  comments: [Comment!]!
  createdAt: String!
}

enum SortOrder {
  ASC
  DESC
}

enum PostSortField {
  CREATED_AT
  TITLE
}

type Comment {
  id: ID!
  content: String!
  author: User!
  post: Post!
}

type PaginatedPosts {
  items: [Post!]!
  totalCount: Int!
}

