type Query{
    messages:[Message!]!

    users: [User!]!
    user(id: ID!): User

    posts: [Post!]!
    post(id: ID!): Post

    comments: [Comment!]!
    comment(id: ID!): Comment

    UserById(id:ID!):UserResult

    paginatedPosts(page: Int!, pageSize: Int!, sortBy: PostSortField = CREATED_AT, sortOrder: SortOrder = DESC): PaginatedPosts!

    chatMessages: [ChatMessage!]!
    chatUsers: [ChatUser!]!

    AllMessages: [ChatMessage!]!

    }

    

type Mutation{
    postMessage(content:String!,author:String!,comments:[String!]):Message!

    updateUser(id: ID!, name: String, email: String): User
  
    deleteComment(id: ID!): Comment

    addPost(title: String!, content: String!, authorId: ID!): Post
    
    addComment(content: String!, authorId: ID!, postId: ID!): Comment

    register(username: String!, password: String!): User!

    login(username: String!, password: String!): AuthPayload!

    logout:ChatUser!
    
    sendMessage(content: String!): ChatMessage!
}

type Subscription{
 messagePosted: Message!
 addComment: Comment!
 userStatus: ChatUser

}